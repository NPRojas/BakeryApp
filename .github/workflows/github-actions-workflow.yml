name: Release to Firebase Distribution Testing
run-name: ${{ github.actor }} is deploying to Firebase

on:
  pull_request:
    branches: [main]

jobs:
  CI-CD-Flow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Load Google Service file
        env:
          FILE: ${{ secrets.GOOGLE_SERVICES }}
        run: echo $FILE | base64 --decode > app/google-services.json

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          script: ./gradlew connectedCheck

      - name: List connected devices
        run: adb devices

      - name: Run UI + "Unit" tests
        run: ./gradlew connectedAndroidTest

      - name: Build APK
        run: ./gradlew assembleRelease 

      - name: Upload app to testers using Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: app/build/outputs/apk/release/app-release-unsigned.apk


